<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบยืมฟิล์มระหว่างโรงงาน (Film Borrowing System)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🎬 ระบบสั่งยืมฟิล์มระหว่างโรงงาน
            </h1>
            <span class="bg-indigo-800 text-xs px-3 py-1 rounded-full border border-indigo-500">v2.3 (Real-time Sync & Return)</span>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- ฝั่งซ้าย: ฟอร์มกรอกข้อมูล -->
        <section class="lg:col-span-5 bg-white p-6 rounded-xl shadow-md border border-slate-200 h-fit space-y-4">
            <h2 class="text-lg font-bold text-indigo-900 border-b pb-2">➕ บันทึกคำขอยืมฟิล์ม</h2>
            
            <!-- ผู้ยืม - ผู้ให้ยืม -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">โรงงานผู้ยืม</label>
                    <select id="borrower" class="w-full p-2 text-sm border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="โรงงานใหม่">โรงงานใหม่</option>
                        <option value="โรงงานเก่า">โรงงานเก่า</option>
                        <option value="RoyalOhm">RoyalOhm</option>
                        <option value="RoyalTech">RoyalTech</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">โรงงานผู้ให้ยืม</label>
                    <select id="lender" class="w-full p-2 text-sm border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="โรงงานเก่า">โรงงานเก่า</option>
                        <option value="โรงงานใหม่">โรงงานใหม่</option>
                        <option value="RoyalOhm">RoyalOhm</option>
                        <option value="RoyalTech">RoyalTech</option>
                    </select>
                </div>
            </div>

            <hr class="border-slate-100 my-2">

            <!-- สเปกฟิล์ม -->
            <form id="itemForm" onsubmit="addItemToCart(event)" class="space-y-3">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ขั้นตอน (Process)</label>
                        <select id="processStep" class="w-full p-2 text-sm border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="C2">C2</option>
                            <option value="C1">C1</option>
                            <option value="R">R</option>
                            <option value="G1">G1</option>
                            <option value="G2">G2</option>
                            <option value="CR">CR</option>
                            <option value="MK">MK</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ไซส์ฟิล์ม (Size)</label>
                        <input type="text" id="filmSize" placeholder="เช่น 0805, 0603" required class="w-full p-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">เปอร์เซ็นต์ (%)</label>
                        <input type="text" id="filmPercentage" placeholder="เช่น 1%, 5%" required class="w-full p-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ค่างาน (Job Value)</label>
                        <input type="text" id="jobValue" placeholder="เช่น 1K, 100R" required class="w-full p-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">แรงค์ (Rank)</label>
                        <input type="text" id="filmRank" placeholder="เช่น 54-55-56" required class="w-full p-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">จำนวน (แผ่น)</label>
                        <input type="number" id="quantity" min="1" value="1" required class="w-full p-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">หมายเหตุเพิ่มเติม</label>
                    <textarea id="note" rows="2" placeholder="ระบุเพิ่มเติม (ถ้ามี)" class="w-full p-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-medium py-2 rounded-lg shadow transition text-sm flex justify-center items-center gap-1">
                    ➕ เพิ่มรายการลงรายการรอส่ง
                </button>
            </form>

            <!-- ตารางรายการที่เตรียมส่ง -->
            <div id="cartSection" class="pt-2 border-t hidden">
                <h3 class="text-xs font-bold text-amber-600 mb-2">🛒 รายการที่เตรียมส่ง (<span id="cartCount">0</span> รายการ)</h3>
                <div class="max-h-40 overflow-y-auto space-y-1 mb-3" id="cartList"></div>
                <button onclick="submitBatchOrders()" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow-md transition text-sm">
                    🚀 ส่งออเดอร์ทั้งหมดไป LINE
                </button>
            </div>
        </section>

        <!-- ฝั่งขวา: รายการออเดอร์ทั้งหมด -->
        <section class="lg:col-span-7 bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 mb-4 border-b pb-3">
                <h2 class="text-lg font-bold text-indigo-900">📋 รายการออเดอร์ยืมฟิล์ม</h2>
                
                <!-- ช่องค้นหา และ ปุ่ม Refresh -->
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <input type="text" id="searchInput" onkeyup="filterOrders()" placeholder="🔍 ค้นหา Size, Job, Process..." class="p-1.5 px-3 text-xs border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none w-full md:w-48">
                    <span id="syncStatus" class="text-[10px] text-slate-400 whitespace-nowrap">กำลังเชื่อมต่อ...</span>
                    <button onclick="fetchOrders()" class="text-xs text-indigo-600 hover:underline font-semibold whitespace-nowrap">🔄 ดึงข้อมูลใหม่</button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 font-semibold border-b">
                            <th class="p-2">วันที่/เวลา</th>
                            <th class="p-2">เส้นทาง</th>
                            <th class="p-2">ขั้นตอน / สเปกฟิล์ม</th>
                            <th class="p-2 text-center">จำนวน (แผ่น)</th>
                            <th class="p-2">สถานะ</th>
                            <th class="p-2 text-center">การจัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
            
            <div id="emptyMessage" class="text-center py-8 text-slate-400 text-sm hidden">
                ยังไม่มีข้อมูลการยืมฟิล์มในขณะนี้
            </div>
        </section>

    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwO7htrn1Wq_yrR2f3TMxjPUxu0J_VZNcw8_0rf9NDR3WHe2JWJdQuwxup5jpVzSbye/exec';

        let cart = [];
        let orders = [];

        // โหลดข้อมูลครั้งแรก และดึงข้อมูลใหม่อัตโนมัติทุกๆ 10 วินาที
        fetchOrders();
        setInterval(fetchOrders, 10000);

        async function fetchOrders() {
            const syncStatus = document.getElementById('syncStatus');
            try {
                const response = await fetch(SCRIPT_URL);
                orders = await response.json();
                renderTable();
                syncStatus.innerText = 'อัปเดตแล้ว: ' + new Date().toLocaleTimeString('th-TH');
            } catch (error) {
                console.error('Error fetching data:', error);
                syncStatus.innerText = 'โหลดไม่สำเร็จ';
            }
        }

        function addItemToCart(e) {
            e.preventDefault();

            const borrower = document.getElementById('borrower').value;
            const lender = document.getElementById('lender').value;

            if(borrower === lender) {
                alert('โรงงานผู้ยืมและผู้ให้ยืมต้องไม่เป็นโรงงานเดียวกันครับ');
                return;
            }

            const item = {
                id: 'ORD-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                borrower: borrower,
                lender: lender,
                processStep: document.getElementById('processStep').value,
                filmSize: document.getElementById('filmSize').value,
                filmPercentage: document.getElementById('filmPercentage').value,
                jobValue: document.getElementById('jobValue').value,
                filmRank: document.getElementById('filmRank').value,
                quantity: document.getElementById('quantity').value,
                note: document.getElementById('note').value
            };

            cart.push(item);
            renderCart();
            document.getElementById('itemForm').reset();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            renderCart();
        }

        function renderCart() {
            const cartSection = document.getElementById('cartSection');
            const cartList = document.getElementById('cartList');
            const cartCount = document.getElementById('cartCount');

            cartCount.innerText = cart.length;
            cartList.innerHTML = '';

            if (cart.length === 0) {
                cartSection.classList.add('hidden');
                return;
            }

            cartSection.classList.remove('hidden');
            cart.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-amber-50 p-2 rounded border border-amber-200 text-xs';
                div.innerHTML = `
                    <div>
                        <span class="bg-indigo-100 text-indigo-700 font-bold px-1.5 py-0.5 rounded mr-1">[${item.processStep}]</span>
                        <span class="font-bold text-slate-700">${index + 1}. Size: ${item.filmSize}</span> (%:${item.filmPercentage}, Job:${item.jobValue}, Rank:${item.filmRank})
                        <span class="font-bold text-indigo-600">${item.quantity} แผ่น</span>
                    </div>
                    <button onclick="removeFromCart('${item.id}')" class="text-red-500 font-bold px-1">✕</button>
                `;
                cartList.appendChild(div);
            });
        }

        async function submitBatchOrders() {
            if (cart.length === 0) return;

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังส่งข้อมูล...';

            const now = new Date().toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });

            for (const item of cart) {
                const payload = {
                    action: 'createOrder',
                    ...item,
                    createdAt: now,
                    status: 'PENDING'
                };

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                } catch (error) {
                    console.error('Error submitting order:', error);
                }
            }

            alert(`บันทึกและส่งข้อมูลเรียบร้อยแล้วทั้งหมด ${cart.length} รายการ!`);
            cart = [];
            renderCart();
            fetchOrders();

            submitBtn.disabled = false;
            submitBtn.innerText = originalText;
        }

        async function updateStatus(id, newStatus) {
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'updateStatus', id: id, status: newStatus })
                });
                fetchOrders();
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        async function deleteOrder(id) {
            if(confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'deleteOrder', id: id })
                    });
                    fetchOrders();
                } catch (error) {
                    console.error('Error deleting order:', error);
                }
            }
        }

        function filterOrders() {
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('orderTableBody');
            const emptyMsg = document.getElementById('emptyMessage');
            const searchInput = document.getElementById('searchInput').value.toLowerCase().trim();
            tbody.innerHTML = '';

            if (!orders || orders.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }

            // กรองข้อมูลตามช่องค้นหา
            const filteredOrders = orders.filter(order => {
                const searchText = `${order.borrower} ${order.lender} ${order.processStep} ${order.filmSize} ${order.filmPercentage} ${order.jobValue} ${order.filmRank} ${order.note} ${order.status}`.toLowerCase();
                return searchText.includes(searchInput);
            });

            if (filteredOrders.length === 0) {
                emptyMsg.innerText = 'ไม่พบข้อมูลที่ตรงกับคำค้นหา';
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.innerText = 'ยังไม่มีข้อมูลการยืมฟิล์มในขณะนี้';
                emptyMsg.classList.add('hidden');
            }

            filteredOrders.forEach(order => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';

                let statusBadge = '';
                if(order.status === 'PENDING') {
                    statusBadge = `<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded font-semibold">รออนุมัติ</span>`;
                } else if(order.status === 'APPROVED') {
                    statusBadge = `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-semibold">อนุมัติแล้ว</span>`;
                } else if(order.status === 'COMPLETED') {
                    statusBadge = `<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-semibold">ได้รับแล้ว</span>`;
                } else if(order.status === 'RETURNED') {
                    statusBadge = `<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded font-semibold">ส่งคืนแล้ว</span>`;
                }

                tr.innerHTML = `
                    <td class="p-2 text-slate-500 whitespace-nowrap">${order.createdAt}</td>
                    <td class="p-2 font-medium">
                        <span class="text-indigo-600">${order.borrower}</span> 
                        <span class="text-slate-400">⬅</span> 
                        <span class="text-slate-600">${order.lender}</span>
                    </td>
                    <td class="p-2">
                        <div class="font-bold text-indigo-700 mb-0.5">📌 ขั้นตอน: ${order.processStep || '-'}</div>
                        <div class="font-semibold text-slate-800">Size: ${order.filmSize} | %: ${order.filmPercentage}</div>
                        <div class="text-slate-500">Job: ${order.jobValue} | Rank: ${order.filmRank}</div>
                        ${order.note ? `<div class="text-slate-400 italic text-[10px]">Note: ${order.note}</div>` : ''}
                    </td>
                    <td class="p-2 text-center font-bold text-slate-700">${order.quantity}</td>
                    <td class="p-2 whitespace-nowrap">${statusBadge}</td>
                    <td class="p-2 text-center whitespace-nowrap">
                        <div class="flex items-center justify-center gap-1">
                            ${order.status === 'PENDING' ? 
                                `<button onclick="updateStatus('${order.id}', 'APPROVED')" class="bg-emerald-600 text-white px-2 py-1 rounded hover:bg-emerald-700 text-[10px]">อนุมัติ</button>` : ''}
                            ${order.status === 'APPROVED' ? 
                                `<button onclick="updateStatus('${order.id}', 'COMPLETED')" class="bg-indigo-600 text-white px-2 py-1 rounded hover:bg-indigo-700 text-[10px]">รับของแล้ว</button>` : ''}
                            ${order.status === 'COMPLETED' ? 
                                `<button onclick="updateStatus('${order.id}', 'RETURNED')" class="bg-purple-600 text-white px-2 py-1 rounded hover:bg-purple-700 text-[10px]">🔄 ส่งคืนฟิล์ม</button>` : ''}
                            <button onclick="deleteOrder('${order.id}')" class="text-red-400 hover:text-red-600 px-1 py-1 text-[10px]">ลบ</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
